name: new_sara
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+18

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  local_auth: ^2.1.7
  marquee: ^2.2.3

  get: ^4.7.2
  dio: ^5.8.0+1
  share_plus: ^7.2.2
  url_launcher: ^6.3.2
  shared_preferences: ^2.2.2
  flutter_svg: ^2.0.7
  fluttertoast: ^8.2.2
  get_storage: ^2.1.1
  google_fonts: ^5.1.0
  translator: ^1.0.3+1
  flutter_pay_upi: ^0.2.1
  device_info_plus: ^10.0.0
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  provider: ^6.0.5
  connectivity_plus: ^6.0.4
  flutter_local_notifications: ^19.4.0
  change_app_package_name: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# -------------------------------
#  ✔ Correct Launcher Icon Setup
# -------------------------------
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/market_open.png"


# -------------------------------
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icon/
    - assets/icons/
